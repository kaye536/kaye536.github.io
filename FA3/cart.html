<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Plushie Food Co.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <span class="logo">🧸🍰</span>
            <h1>Plushie Food Company</h1>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="catalog.html">Products</a></li>
                    <li><a href="cart.html" class="active">Shopping Cart</a></li>
                </ul>
            </nav>
        </aside>

        <main class="content">
            <section class="cart-header">
                <h2>My Shopping Basket</h2>
                <p>You have 6 items ready for cuddles!</p>
            </section>

            <br>

            <section class="owner-card" style="max-width: 600px;">
                <article class="cart-item" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <span>🍔 <strong>Burger Pal</strong></span>
                    <span>$15.00</span>
                </article>
                <article class="cart-item" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <span>🍣 <strong>Sushi Roll Softie</strong></span>
                    <span>$12.00</span>
                </article>
                <article class="cart-item" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <span>🍦 <strong>Scoop Icecream</strong></span>
                    <span>$10.00</span>
                </article>
                <article class="cart-item" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <span>🍕 <strong>Pizza Slice Snuggle</strong></span>
                    <span>$14.00</span>
                </article>
                <article class="cart-item" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <span>🌮 <strong>Tiny Taco Friend</strong></span>
                    <span>$13.00</span>
                </article>
                <article class="cart-item" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <span>🍩 <strong>Donut Delight</strong></span>
                    <span>$9.00</span>
                </article>
            </section>

            <br>

            <section class="owner-card" style="max-width: 600px; background-color: #FFF0F5;">
                <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold;">
                    <span>Total Amount:</span>
                    <span>$73.00</span>
                </div>
                <hr style="border: 1px solid #FFD1DC; margin: 15px 0;">
                <button style="width: 100%;" onclick="location.href='checkout.html'">Proceed to Payment</button>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
