<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Delivery | Plushie Food Co.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo">🧸🍰</div>
            <h1>Plushie Food Company</h1>
        </div>
    </header>

    <div class="main-container">
        <main class="content">
            <h2>Checkout Details</h2>
            <form class="contact-form" action="confirmation.html">
                <section class="form-group">
                    <label>Preferred Delivery Method</label>
                    <select style="width: 100%; padding: 12px; border: 2px solid #FFD1DC; border-radius: 10px;">
                        <option>Standard Shipping (3-5 Days)</option>
                        <option>Express Cuddle Delivery (Next Day)</option>
                    </select>
                </section>

                <section class="form-group">
                    <label>Payment Method</label>
                    <div style="margin-top: 10px;">
                        <input type="radio" name="pay" checked> GCash / Maya <br>
                        <input type="radio" name="pay"> Cash on Delivery
                    </div>
                </section>
                
                <button type="submit">Place Order</button>
            </form>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
